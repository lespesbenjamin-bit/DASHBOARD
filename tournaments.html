<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3652FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cockpit" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Tournois — Cockpit</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="greeting">
        <h1>🏆 Tournois</h1>
        <div class="date" id="tournaments-sub"></div>
      </div>
      <a href="coaching.html" class="logout-link">← Coaching</a>
    </div>

    <div class="kpi-hero-grid">
      <div class="kpi-hero accent">
        <div class="kpi-hero-label">CA réalisé (année)</div>
        <div class="kpi-hero-num" id="kpi-ca">–</div>
      </div>
      <div class="kpi-hero">
        <div class="kpi-hero-label">Net (année)</div>
        <div class="kpi-hero-num" id="kpi-net">–</div>
      </div>
    </div>

    <div class="card" style="text-align:right;">
      <button class="btn-primary" id="btn-add-tournament" style="width:auto;padding:10px 18px;">+ Nouveau tournoi</button>
    </div>

    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-status="all">Tous</button>
      <button class="filter-tab" data-status="prevu">Prévus</button>
      <button class="filter-tab" data-status="realise">Réalisés</button>
    </div>

    <div id="tournament-list"><p class="empty">Chargement...</p></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Aujourd'hui</span></a>
    <a href="week.html" class="nav-item"><span class="icon">📅</span><span>Semaine</span></a>
    <a href="#" class="nav-add" id="nav-add">+</a>
    <a href="business.html" class="nav-item"><span class="icon">💰</span><span>Business</span></a>
    <a href="tasks.html" class="nav-item active"><span class="icon">☰</span><span>Plus</span></a>
  </nav>

  <!-- MODALE TOURNOI -->
  <div class="modal-overlay" id="tournament-modal-overlay">
    <div class="modal">
      <h2 id="tournament-modal-title">Nouveau tournoi</h2>
      <form id="tournament-form">
        <input type="hidden" id="to-id" />

        <div class="field">
          <label>Niveau</label>
          <div class="chip-select" id="to-level">
            <div class="chip" data-key="P25">P25</div>
            <div class="chip selected" data-key="P50">P50</div>
            <div class="chip" data-key="P100">P100</div>
            <div class="chip" data-key="P250">P250</div>
          </div>
        </div>

        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="to-date" required /></div>
          <div class="field"><label>Nombre d'équipes</label><input type="number" id="to-teams" min="1" value="8" required /></div>
        </div>

        <div class="field">
          <label>Statut</label>
          <select id="to-status">
            <option value="prevu">Prévu</option>
            <option value="realise">Réalisé</option>
            <option value="annule">Annulé</option>
          </select>
        </div>

        <div class="field"><label>Notes (optionnel)</label><textarea id="to-notes"></textarea></div>

        <div class="card" id="to-calc-preview" style="margin-top:6px;">
          <p class="card-title">CALCUL ESTIMÉ</p>
          <div class="session-amounts">
            <div class="amount-block"><div class="amount-num" id="to-prev-ca">–</div><div class="amount-label">CA (commission)</div></div>
            <div class="amount-block"><div class="amount-num" id="to-prev-homolog">–</div><div class="amount-label">HOMOLOGATION</div></div>
            <div class="amount-block"><div class="amount-num" id="to-prev-net">–</div><div class="amount-label">NET</div></div>
          </div>
        </div>

        <p class="error-msg" id="tournament-error"></p>

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="cancel-tournament-modal">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="coaching-engine.js"></script>
  <script src="tournaments.js"></script>
  <script src="add-menu.js"></script>
  <script src="pwa-register.js"></script>
</body>
</html>
